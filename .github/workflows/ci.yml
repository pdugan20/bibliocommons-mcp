name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: pip install ruff
      - name: Check linting
        run: ruff check src/ tests/
      - name: Check formatting
        run: ruff format --check src/ tests/

  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            **/*.md
            !CHANGELOG.md

  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Prettier check
        # Pinned to the repo's prettier (web/package-lock.json) so CI doesn't
        # float to a newer 3.x whose markdown rules disagree with committed
        # files (3.9.x rewrites a bare "~approx" to "~~", i.e. strikethrough).
        run: npx prettier@3.8.3 --check '**/*.{json,yml,yaml,md}' --ignore-path .prettierignore

  claude-lint:
    name: Claude Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run claude-code-lint
        run: npx claude-code-lint@latest

  web-bundles:
    name: Web bundle freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web deps
        run: npm ci
        working-directory: web
      - name: Rebuild bundles
        run: npm run build:bundles
        working-directory: web
      # The committed _ui_bundles.py was emitted by the same build
      # script. If a contributor edits anything in web/ but forgets
      # to rerun `make build-web`, this diff catches it. Bundle output
      # is byte-stable across Node 22 + the lockfile, so any drift
      # here is a real out-of-sync, not flake.
      - name: Diff against committed bundles
        run: |
          if ! git diff --exit-code -- src/bibliocommons_mcp/_ui_bundles.py; then
            echo "::error::Web bundles are out of date. Run 'make build-web' and commit the regenerated _ui_bundles.py."
            exit 1
          fi
      - name: Web lint + typecheck
        run: |
          npm run lint
          npm run typecheck
          npm run format:check
        working-directory: web

  test:
    name: Tests (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"
      - name: Run tests with coverage
        run: python -m pytest tests/ -v --tb=short --cov-report=xml
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false

  infra-lint:
    name: Infra Lint (Docker + Fly)
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile
      - name: Check fly.toml formatting (taplo)
        run: npx --yes @taplo/cli@latest fmt --check fly.toml
      # Semantic fly.toml validation needs platform auth; runs only when the
      # FLY_API_TOKEN secret is configured, otherwise skipped (not failed).
      - name: Set up flyctl
        if: env.FLY_API_TOKEN != ''
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Validate fly.toml (flyctl)
        if: env.FLY_API_TOKEN != ''
        run: flyctl config validate

  docs-reference:
    name: Docs Reference Freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e .
      - name: Regenerate the CLI + MCP reference from source
        run: |
          python scripts/gen_cli_reference.py
          python scripts/gen_mcp_reference.py
      - name: Fail if the generated reference drifted from the code
        run: |
          git diff --exit-code docs-mintlify/reference/cli.mdx docs-mintlify/reference/mcp-tools.mdx \
            || { echo "::error::Docs reference is stale. Run 'make docs-reference' and commit."; exit 1; }

  docs-links:
    name: Docs Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate docs links (mint broken-links)
        run: cd docs-mintlify && npx --yes mint@latest broken-links
