name: Docker Build

# Builds the remote/HTTP container image and smoke-tests its /healthz route
# in read-only (authless) mode. Does NOT push — pushing to a registry needs
# credentials the owner supplies later (see
# docs/projects/remote-mcp-mobile-followups.md, task 1.8).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  impact:
    name: Classify Docker impact
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.classify.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}"; then
            echo "Unable to prove the comparison base; failing safe by building."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-paths.txt"
          cat "$RUNNER_TEMP/changed-paths.txt"
          build="$(python scripts/classify_docker_impact.py < "$RUNNER_TEMP/changed-paths.txt")"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build:
    name: Build image + healthz smoke
    needs: impact
    if: needs.impact.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: bibliocommons-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test /healthz (read-only mode, no credentials)
        run: |
          docker run -d --name bib \
            -e BIBLIOCOMMONS_LIBRARY=seattle \
            -e PORT=8000 \
            -p 8000:8000 \
            bibliocommons-mcp:ci
          ok=0
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/healthz | grep -q '"status":"ok"'; then
              ok=1
              break
            fi
            sleep 1
          done
          echo "--- container logs ---"
          docker logs bib
          docker rm -f bib >/dev/null 2>&1 || true
          if [ "$ok" != "1" ]; then
            echo "::error::/healthz did not return status ok"
            exit 1
          fi

  gate:
    name: Docker Gate
    if: ${{ always() }}
    needs: [impact, build]
    runs-on: ubuntu-latest
    steps:
      - name: Require the classified Docker outcome
        env:
          IMPACT_RESULT: ${{ needs.impact.result }}
          BUILD_REQUIRED: ${{ needs.impact.outputs.build }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          python - <<'PY'
          import os
          import sys

          impact = os.environ["IMPACT_RESULT"]
          required = os.environ["BUILD_REQUIRED"]
          build = os.environ["BUILD_RESULT"]
          print(f"impact={impact} required={required} build={build}")

          valid = impact == "success" and (
              (required == "true" and build == "success")
              or (required == "false" and build == "skipped")
          )
          if not valid:
              print("::error::Docker impact classification or smoke build failed closed")
              sys.exit(1)
          PY
