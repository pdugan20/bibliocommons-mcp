name: Publish to TestPyPI

# Staging publish that fires whenever release-please updates a release PR.
# Catches packaging-time errors (bad classifiers, missing wheel files,
# trusted-publisher misconfig) before they hit prod PyPI.
#
# One-time setup before publishing:
#   1. Create a TestPyPI account at https://test.pypi.org
#   2. Configure a "pending publisher" on TestPyPI for project
#      `bibliocommons-mcp` pointing at this workflow filename
#      (`publish-testpypi.yml`) and the `testpypi` environment below.
#   3. Create a `testpypi` environment in the repo settings.
#   4. Set repository variable `TESTPYPI_TRUSTED_PUBLISHING_ENABLED=true`.
#
# Until then the package is still built on every release-please update, but
# publication is skipped instead of creating a known-failing release check.
#
# `skip-existing: true` handles the case where release-please updates the
# same release PR multiple times (TestPyPI rejects duplicate versions).

on:
  push:
    branches:
      - "release-please--branches--main--*"

permissions:
  contents: read
  id-token: write

jobs:
  publish-testpypi:
    name: Build and optionally publish to TestPyPI
    runs-on: ubuntu-latest
    environment: testpypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build==1.5.0
      - name: Build package
        run: python -m build
      - name: Publish to TestPyPI
        if: ${{ vars.TESTPYPI_TRUSTED_PUBLISHING_ENABLED == 'true' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
