name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing! Before submitting, please:

        - **Don't include your library card number, PIN, or any session cookies / tokens in this report.** Anything you paste here is public.
        - Check `library_health` output — it tells you what library/account state the server sees.
  - type: input
    id: library
    attributes:
      label: Library subdomain
      description: e.g. `seattle`, `sfpl`, `bpl`. The `{name}` in `{name}.bibliocommons.com`.
      placeholder: seattle
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: bibliocommons-mcp version
      description: Output of `pip show bibliocommons-mcp | head -2`
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.7"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, what did you get? Include the tool name + arguments if relevant.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: |
        Server logs go to stderr — capture them by setting `BIBLIOCOMMONS_MCP_LOG_LEVEL=DEBUG`.
        Redact any card, PIN, or session cookies before pasting.
      render: shell
