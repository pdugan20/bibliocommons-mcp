[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bibliocommons-mcp"
dynamic = ["version"]
description = "MCP server for BiblioCommons-powered public libraries — search, place holds, manage your account"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Pat Dugan" }]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "bibliocommons>=2025.3",
    "httpx>=0.28",
    "lxml>=5",
    # mcp>=1.27 = MCP spec 2025-11-25 (tool annotations, structured output,
    # elicitation, ToolError). Anything older lacks features we depend on.
    "mcp>=1.27",
]

[project.scripts]
bibliocommons-mcp = "bibliocommons_mcp.server:main"

[project.urls]
Homepage = "https://pypi.org/project/bibliocommons-mcp/"
Repository = "https://github.com/pdugan20/bibliocommons-mcp"
Issues = "https://github.com/pdugan20/bibliocommons-mcp/issues"
Changelog = "https://github.com/pdugan20/bibliocommons-mcp/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.0",
    "pyyaml>=6.0",
    "syrupy>=4.0",
    "vcrpy>=6.0",
    "ruff>=0.9",
    "build>=1.0",
    "pre-commit>=3.5",
]

[tool.hatch.version]
path = "src/bibliocommons_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bibliocommons_mcp"]

[tool.pytest.ini_options]
addopts = "--cov=bibliocommons_mcp --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:vcr.*",
]

[tool.coverage.run]
omit = ["src/bibliocommons_mcp/__main__.py"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["bibliocommons_mcp"]
